description: 'CareBridge is a home and community-based healthcare company that delivers 24/7 virtual
  and in-home care coordination to high-risk, largely Medicaid populations on behalf of health plans.
  Its interdisciplinary care teams address members'' physical, behavioral, and social health needs, and
  the company operates three core service lines: 24/7 member support, decision support (durable medical
  equipment and technology provisioning), and Electronic Visit Verification (EVV) technology used by
  state Medicaid programs and managed-care organizations. Headquartered in Nashville, Tennessee, CareBridge
  was surfaced as a portfolio company of GV. As of this enrichment pass the company publishes no public
  developer portal, API documentation, OpenAPI/AsyncAPI specification, SDKs, or /.well-known discovery
  surface; this profile therefore captures its public identity and domain-security posture only.'
